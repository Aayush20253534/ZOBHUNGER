name: Encrypted database backup

on:
  schedule:
    # GitHub cron is UTC. 07:30 UTC = 13:00 IST, 19:30 UTC = 01:00 IST.
    - cron: "30 7 * * *"
    - cron: "30 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zobhunger-database-backup
  cancel-in-progress: false

jobs:
  backup:
    name: PostgreSQL to encrypted Google Drive backup
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_ENCRYPTION_KEY_B64: ${{ secrets.BACKUP_ENCRYPTION_KEY_B64 }}
      BACKUP_ENCRYPTION_KEY_ID: ${{ vars.BACKUP_ENCRYPTION_KEY_ID }}
      BACKUP_RETENTION_DAYS: ${{ vars.BACKUP_RETENTION_DAYS }}
      GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
      GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
      GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install PostgreSQL 18 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common ca-certificates
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/18/bin/pg_dump --version
          /usr/lib/postgresql/18/bin/pg_restore --version

      - name: Create encrypted Drive backup
        run: npm run backup:database

      - name: Verify the uploaded Drive backup
        run: npm run backup:verify

      - name: Upload non-secret backup report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-backup-report-${{ github.run_id }}
          path: .release-artifacts/database-backup-report.json
          if-no-files-found: warn
          retention-days: 30
