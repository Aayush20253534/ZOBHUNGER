name: Chatbot release gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chatbot-release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm --prefix server ci
      - run: npm run chatbot:release-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chatbot-release-evidence
          path: |
            .release-artifacts/chatbot-release-check.json
          if-no-files-found: error
          retention-days: 14
