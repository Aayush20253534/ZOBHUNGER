name: Phase 2 release checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: phase2_test
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: zobhunger_phase2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U phase2_test -d zobhunger_phase2_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://phase2_test:local_ci_only@127.0.0.1:5432/zobhunger_phase2_test
      TEST_DATABASE_KIND: PostgreSQL 16 (isolated CI service)
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - run: npm --prefix server ci
      - run: npm --prefix client ci
      - run: npm run verify:phase2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2-code-checks
          path: .release-artifacts/phase2-code-checks.json
          if-no-files-found: error
          retention-days: 14
